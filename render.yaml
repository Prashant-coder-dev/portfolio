services:
  - type: web
    name: my-portfolio
    runtime: static
    buildCommand: ''
    staticPublishPath: .
    headers:
      - path: /
        name: Cache-Control
        value: public, max-age=600
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: redirect
        source: /index.html
        destination: /
        status: 301
      - type: rewrite
        source: /404
        destination: /404.html


